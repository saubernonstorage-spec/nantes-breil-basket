# Classements et résultats FFBB des équipes du NBB : récupérés chaque nuit (scripts/donnees_ffbb.py).
# S'ils ont changé, data/classements-ffbb.json et data/resultats-ffbb.json sont mis à jour sur main :
# Netlify republie le site. Si la FFBB ne répond pas, la tâche échoue sans rien modifier et le site
# garde les dernières données.
# Lancement manuel : onglet « Actions » du dépôt → « Données FFBB » → « Run workflow ».
name: Données FFBB

on:
  schedule:
    - cron: "15 5 * * *" # chaque jour à 5 h 15 UTC (7 h 15 à Paris en été, 6 h 15 en hiver)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-ffbb
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ffbb.txt

      - name: Installer la bibliothèque FFBB
        run: pip install -r scripts/requirements-ffbb.txt

      - name: Récupérer les classements et les résultats
        run: python scripts/donnees_ffbb.py

      - name: Publier si les données ont changé
        run: |
          if git diff --quiet -- data/classements-ffbb.json data/resultats-ffbb.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classements-ffbb.json data/resultats-ffbb.json
          git commit -m "Classements et résultats FFBB mis à jour"
          git pull --rebase
          git push
