# Classements, résultats, calendrier des matchs et logos des clubs FFBB : récupérés chaque nuit
# (scripts/donnees_ffbb.py). S'ils ont changé, les fichiers data/*-ffbb.json et public/logos/ sont mis
# à jour sur main : Hostinger redéploie le site. Si la FFBB ne répond pas, la tâche échoue sans rien
# modifier et le site garde les dernières données.
# Lancement manuel : onglet « Actions » du dépôt → « Données FFBB » → « Run workflow ».
name: Données FFBB

on:
  schedule:
    - cron: "15 5 * * *" # chaque jour à 5 h 15 UTC (7 h 15 à Paris en été, 6 h 15 en hiver)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-ffbb
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ffbb.txt

      - name: Installer la bibliothèque FFBB
        run: pip install -r scripts/requirements-ffbb.txt

      - name: Récupérer les classements, les résultats et les logos
        run: python scripts/donnees_ffbb.py

      - name: Publier si les données ont changé
        run: |
          git add data/classements-ffbb.json data/resultats-ffbb.json data/matchs-ffbb.json data/logos-ffbb.json public/logos
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données FFBB mises à jour (classements, résultats, matchs, logos)"
          git pull --rebase
          git push
